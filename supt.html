<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>대공 PKG3 SUPT 조회</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f0f2f5;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 980px;
  margin: 0 auto;
  background: #ffffff;
  min-height: 100vh;
  padding: 12px 14px 40px;
}

/* 상단 고정 바 */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 999;
  background: #ffffff;
  padding: 10px 8px 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

/* 제목 */
.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
}
.badge-fast {
  font-size: 11px;
  padding: 3px 8px;
  background: #e6f0ff;
  border: 1px solid #bdd3ff;
  color: #2755c7;
  border-radius: 999px;
  white-space: nowrap;
}

/* 라디오 버튼 */
.search-modes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  margin: 10px 0 8px;
}

.search-modes label {
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  background: #f6f7fb;
  cursor: pointer;
}

.search-modes input[type="radio"] {
  accent-color: #2563eb;
}

/* 검색 입력 */
.search-input-wrapper {
  position: relative;
  width: 100%;
}

#searchInput {
  width: 100%;
  padding: 14px 48px 14px 18px;
  font-size: 17px;
  border-radius: 999px;
  border: 1px solid #ccc;
  outline: none;
}

.clear-btn {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  font-size: 22px;
  cursor: pointer;
  opacity: 0.5;
}
.clear-btn:hover {
  opacity: 0.9;
}

/* 테이블 */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
thead {
  background: #f7f7f9;
  position: sticky;
  top: 108px;
  z-index: 998;
}
th, td {
  padding: 8px 10px;
  border-bottom: 1px solid #e0e0e0;
  text-align: center;
}
tbody tr:nth-child(odd) {
  background: #fcfcff;
}
tbody tr:hover {
  background: #eef6ff;
}
tbody tr {
  cursor: pointer;
}

/* PC 전용 뒤로가기 */
.pc-back-btn {
  display: none;
  margin-top: 18px;
  padding: 12px 18px;
  background: #2563eb;
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
}
@media (min-width: 801px) {
  .pc-back-btn {
    display: inline-block;
  }
}

/* 모바일 전용 */
@media (max-width: 800px), (max-height: 500px) {
  .badge-fast {
    display: none;
  }

  .top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .title-row {
    width: 100%;
  }

  .search-modes {
    width: 100%;
  }

  .search-input-wrapper {
    order: 3;
    flex: 1 1 65%;
  }

  .top-back-btn {
    order: 4;
    flex: 0 0 auto;
    margin-top: 0 !important;
    padding: 10px 12px !important;
    font-size: 13px !important;
    white-space: nowrap;
    align-self: center;
  }

  .pc-back-btn {
    display: none !important;
  }
}
</style>
</head>

<body>
<div class="container">

  <div class="top-bar">
    <div class="title-row">
      <h1>대공 PKG3 SUPT 조회</h1>
      <div class="badge-fast">PKG No / Assembly 빠른 검색</div>
    </div>

    <a href="https://kdy5642-lgtm.github.io/KDY/"
       class="top-back-btn"
       style="display:inline-block; margin-top:10px; padding:10px 16px;
              background:#2563eb; color:#fff; text-decoration:none;
              border-radius:8px; font-size:14px;">
      ◀ 뒤로가기
    </a>

    <div class="search-modes">
      <label><input type="radio" name="mode" value="pkg" checked><span>PKG No 검색</span></label>
      <label><input type="radio" name="mode" value="assembly"><span>Assembly 검색</span></label>
    </div>

    <div class="search-input-wrapper">
      <input id="searchInput" type="text" placeholder="예: DK3-AG-21-52-01-P-0001-KC 또는 2152-SS-005" />
      <button id="clearBtn" class="clear-btn">×</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:320px;">PKG No</th>
        <th>SUPT Assembly</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>

  <a href="https://kdy5642-lgtm.github.io/KDY/" class="pc-back-btn">
    ◀ 뒤로가기 (PC)
  </a>

</div>

<script>
function parseTextToData(text) {
  const lines = text.trim().split("\n");
  const parsed = [];

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;

    const parts = line.split(/\t+/);

    if (parts.length < 3) continue;

    const pkgNo = parts[0].trim();
    const assembly = parts[1].trim();
    const link = parts[2].trim();

    const row = [pkgNo, assembly, link];
    row._lc = [
      pkgNo.toLowerCase(),
      assembly.toLowerCase()
    ];

    parsed.push(row);
  }

  return parsed;
}

let rawData = [];

async function loadData() {
  const res = await fetch("supt.txt?_=" + Date.now());
  const text = await res.text();
  rawData = parseTextToData(text);
  renderList();
}

function renderList() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const kwRaw = document.getElementById("searchInput").value.trim().toLowerCase();
  const kwNorm = kwRaw.replace(/[-_\s]/g, "");
  const tbody = document.getElementById("resultBody");
  const hasKw = kwRaw.length > 0;

  tbody.innerHTML = "";
  const frag = document.createDocumentFragment();

  rawData.forEach(row => {
    const [pkg, assembly] = row._lc;

    if (hasKw) {
      const ok = {
        pkg: pkg.includes(kwRaw) || pkg.replace(/[-_\s]/g, "").includes(kwNorm),
        assembly: assembly.includes(kwRaw) || assembly.replace(/[-_\s]/g, "").includes(kwNorm)
      };

      if (!ok[mode]) return;
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${row[0]}</td>
      <td>${row[1]}</td>
    `;

    tr.addEventListener("click", () => {
      const link = row[2];
      if (!link) {
        alert("이 행에는 링크가 등록되어 있지 않습니다.");
        return;
      }

      const msg = `아래 Assembly를 여시겠습니까?\n\n${row[1]}`;
      if (!confirm(msg)) return;

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        window.location.href = link;
      } else {
        window.open(link, "_blank", "noopener");
      }
    });

    frag.appendChild(tr);
  });

  tbody.appendChild(frag);
}

let timer = null;
document.getElementById("searchInput").addEventListener("input", () => {
  if (timer) clearTimeout(timer);
  timer = setTimeout(renderList, 300);
});

document.getElementById("clearBtn").addEventListener("click", () => {
  document.getElementById("searchInput").value = "";
  renderList();
});

document.querySelectorAll('input[name="mode"]').forEach(r =>
  r.addEventListener("change", renderList)
);

loadData();
</script>
</body>
</html>
