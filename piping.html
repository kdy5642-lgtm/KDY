<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>대공 PKG3 ISO DWG REVISION 조회</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #f0f2f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
  max-width: 980px;
  margin: 0 auto;
  background: #fff;
  min-height: 100vh;
  padding: 12px 14px 40px;
}

/* 상단 */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 999;
  background: #fff;
  padding: 10px 8px 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: 20px;
}

.badge-fast {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;
  background: #e6f0ff;
  color: #2755c7;
}

.search-modes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 10px 0;
}

.search-modes label {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #f6f7fb;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
}

.search-input-wrapper {
  position: relative;
}

#searchInput {
  width: 100%;
  padding: 14px 48px 14px 18px;
  border-radius: 999px;
  border: 1px solid #ccc;
  font-size: 17px;
  outline: none;
}

.clear-btn {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  font-size: 22px;
  cursor: pointer;
}

/* 테이블 */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 14px;
}

thead {
  background: #f7f7f9;
  position: sticky;
  top: 108px;
  z-index: 998;
}

th, td {
  padding: 8px 10px;
  border-bottom: 1px solid #e0e0e0;
  text-align: center;
}

tbody tr:nth-child(odd) {
  background: #fcfcff;
}

tbody tr:hover {
  background: #eef6ff;
}

tbody tr {
  cursor: pointer;
}

/* 모바일 */
@media (max-width: 800px) {

  thead {
    position: static;
  }

  .badge-fast {
    display: none;
  }

  .top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .title-row,
  .search-modes {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">

    <div class="title-row">
      <h1>대공 PKG3 ISO DWG REVISION 현황</h1>
      <div class="badge-fast">현장 태그 / 타입 빠른 검색</div>
    </div>

    <div class="search-modes">
      <label>
        <input type="radio" name="mode" value="index" checked>
        INDEX 검색
      </label>

      <label>
        <input type="radio" name="mode" value="iso">
        ISO 검색
      </label>

      <label>
        <input type="radio" name="mode" value="Date">
        DATE 검색
      </label>
    </div>

    <div class="search-input-wrapper">
      <input id="searchInput" type="text" placeholder="예: 0001 0002">
      <button id="clearBtn" class="clear-btn">×</button>
    </div>

  </div>

  <table>
    <thead>
      <tr>
        <th style="width:80px;">INDEX</th>
        <th>ISO 도면번호</th>
        <th style="width:160px;">REV</th>
        <th style="width:160px;">DATE</th>
      </tr>
    </thead>

    <tbody id="resultBody">
      <tr>
        <td colspan="4">데이터 불러오는 중...</td>
      </tr>
    </tbody>
  </table>

</div>

<script>
// -----------------------------
// TXT 파싱
// -----------------------------
function parseTextToData(text) {

  const lines = text.trim().split("\n");
  const parsed = [];

  for (let line of lines) {

    line = line.trim();

    if (!line) continue;

    const parts = line.split(/[\t ]+/g);

    const first4 = parts.slice(0, 4);

    const link = line.substring(first4.join(" ").length).trim();

    const [c0, c1, c2, c3] = first4;

    const row = [c0, c1, c2, c3, link];

    row._lc = [
      (c0 || "").toLowerCase(),
      (c1 || "").toLowerCase(),
      (c2 || "").toLowerCase(),
      (c3 || "").toLowerCase()
    ];

    parsed.push(row);
  }

  return parsed;
}

// -----------------------------
let rawData = [];

// -----------------------------
async function loadData() {

  const tbody = document.getElementById("resultBody");

  try {

    const res = await fetch("./pipingdata.txt?_=" + Date.now());

    const text = await res.text();

    rawData = parseTextToData(text);

    // 모바일 첫 렌더링 꼬임 방지
    renderList();

    setTimeout(() => {
      renderList();
    }, 300);

  } catch (err) {

    tbody.innerHTML = `
      <tr>
        <td colspan="4" style="color:red;">
          데이터 로딩 실패
        </td>
      </tr>
    `;
  }
}

// -----------------------------
function renderList() {

  const mode =
    document.querySelector('input[name="mode"]:checked').value;

  const kwRaw =
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const kwNorm =
    kwRaw.replace(/[-_\s]/g, "");

  const tbody =
    document.getElementById("resultBody");

  const hasKw =
    kwRaw.length > 0;

  tbody.innerHTML = "";

  const frag =
    document.createDocumentFragment();

  rawData.forEach(row => {

    const lc = row._lc;

    if (hasKw) {

      const [index, iso, rev, date] = lc;

      let matched = false;

      if (mode === "index") {

        const keywords =
          kwRaw.split(/\s+/)
          .map(v => v.trim())
          .filter(Boolean);

        const indexNorm =
          index.replace(/[-_\s]/g, "");

        matched = keywords.some(word => {

          const wordNorm =
            word.replace(/[-_\s]/g, "");

          return (
            index === word ||
            indexNorm === wordNorm ||
            index.includes(word) ||
            indexNorm.includes(wordNorm)
          );
        });

      } else if (mode === "iso") {

        matched =
          iso.includes(kwRaw) ||
          iso.replace(/[-_\s]/g, "").includes(kwNorm);

      } else if (mode === "Date") {

        matched =
          date.includes(kwRaw) ||
          date.replace(/[-_\s]/g, "").includes(kwNorm);
      }

      if (!matched) return;
    }

    let dateDisplay = row[3];

    const isMobile =
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isMobile) {

      const parts = row[3].split("-");

      if (parts.length === 3) {

        dateDisplay =
          parts[0].slice(2) +
          parts[1] +
          parts[2];
      }
    }

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${row[0]}</td>
      <td>${row[1]}</td>
      <td>${row[2]}</td>
      <td>${dateDisplay}</td>
    `;

    tr.addEventListener("click", () => {

      const link = row[4];

      if (!link) {
        alert("도면 링크가 없습니다.");
        return;
      }

      const ok =
        confirm(`아래 ISO 도면을 여시겠습니까?\n\n${row[1]}`);

      if (!ok) return;

      if (isMobile) {

        window.location.href = link;

      } else {

        window.open(
          link,
          "isoWindow",
          "width=1200,height=900,resizable=yes,scrollbars=yes"
        );
      }
    });

    frag.appendChild(tr);
  });

  tbody.appendChild(frag);

  if (!tbody.children.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="4">
          검색 결과가 없습니다.
        </td>
      </tr>
    `;
  }
}

// -----------------------------
let timer = null;

document.getElementById("searchInput")
.addEventListener("input", () => {

  if (timer) clearTimeout(timer);

  timer = setTimeout(renderList, 200);
});

// -----------------------------
document.getElementById("clearBtn")
.addEventListener("click", () => {

  document.getElementById("searchInput").value = "";

  renderList();
});

// -----------------------------
document.querySelectorAll('input[name="mode"]')
.forEach(r => {

  r.addEventListener("change", renderList);
});

// -----------------------------
window.addEventListener("pageshow", () => {

  if (rawData.length) {
    renderList();
  }
});

// -----------------------------
loadData();
</script>

</body>
</html>
